<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>

*{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

.container {
  width: 400px;
  padding: 35px;
  background-color: rgba(15, 23, 42, 0.95);
  border-radius: 25px;
  box-shadow: 0 0 25px rgba(37, 99, 235, 0.4);
  text-align: center;
}

h2 {
  margin-bottom: 25px;
  font-size: 32px;
  color: #60a5fa;
}

p {
  margin-bottom: 20px;
  color: #cbd5e1;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  border-radius: 12px;
  border: 1px solid #2563eb;
  background-color: #1e293b;
  color: white;
  font-size: 15px;
  outline: none;
  transition: 0.3s;
}

input:focus {
  border-color: #60a5fa;
  box-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #2563eb, #3b82f6);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.03);
  background: linear-gradient(135deg, #3b82f6, #60a5fa);
}

.login-link {
  margin-top: 20px;
  display: block;
  color: #93c5fd;
  text-decoration: none;
  transition: 0.3s;
}

.login-link:hover {
  color: white;
  text-decoration: underline;
}



</style>
</head>

<body>

<div class="container">

  <h2>Create Account</h2>

  <p>Register to access the secure dashboard</p>

  <form method="POST">

    <input 
      type="text" 
      name="username" 
      placeholder="Enter Username" 
      required
    >

    <input 
      type="password" 
      name="password" 
      placeholder="Enter Password" 
      required
    >

    <button type="submit">Register</button>

  </form>

  <a href="/login" class="login-link">
    Already have an account? Login
  </a>

</div>

</body>
</html>
